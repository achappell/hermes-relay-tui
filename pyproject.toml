[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-relay-tui"
version = "0.5.0"
description = "A small Textual terminal UI for authenticated Hermes voice sessions"
readme = "README.md"
requires-python = ">=3.14,<3.15"
authors = [{ name = "Amanda Chappell" }]
dependencies = [
  "textual>=8.2",
  "websockets>=12.0",
  "sounddevice>=0.4.6",
  "python-dotenv>=1.0.1",
  "PyYAML>=6.0",
  "numpy>=2.0",
  "faster-whisper>=1.2.1",
]

[project.scripts]
hermes-relay = "app:main"
hermes-relay-home = "home_display.demo:main"

[tool.setuptools]
py-modules = ["app", "attachments", "audio", "clipboard", "client", "commands", "config", "diagnostics", "history", "mic", "session", "setup_wizard", "shell", "transcript", "voice"]
include-package-data = false

[tool.setuptools.packages.find]
include = ["home_display"]
namespaces = false

[tool.setuptools.package-data]
home_display = ["static/**/*"]
