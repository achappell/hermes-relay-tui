[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-relay-tui"
version = "0.6.1"
description = "A small Textual terminal UI for authenticated Hermes voice sessions"
readme = "README.md"
requires-python = ">=3.14,<3.15"
authors = [{ name = "Amanda Chappell" }]
dependencies = [
  "textual>=8.2",
  "websockets>=12.0",
  "sounddevice>=0.4.6",
  "python-dotenv>=1.0.1",
  "PyYAML>=6.0",
  "numpy>=2.0",
  "faster-whisper>=1.2.1",
]

[project.optional-dependencies]
# Appliance-only. AGENTS.md keeps front-end-specific dependencies out of the
# base list so a terminal install does not pull an ONNX runtime.
wake = [
  "openwakeword>=0.6",
  "onnxruntime>=1.17",
]

# Everything the household appliance needs, as one name. The home unit is a
# different deployment from the terminal client and gets its own install line;
# a laptop running the TUI should never carry an ONNX runtime it will not use.
home = [
  "hermes-relay-tui[wake]",
]

[project.scripts]
hermes-relay = "app:main"
hermes-relay-home = "home_display.appliance:main"
hermes-relay-home-demo = "home_display.demo:main"

[tool.setuptools]
py-modules = ["app", "attachments", "audio", "clipboard", "client", "commands", "config", "diagnostics", "history", "mic", "session", "setup_wizard", "shell", "transcript", "voice", "wake", "handsfree"]
include-package-data = false

[tool.setuptools.packages.find]
include = ["home_display", "wakewords"]
namespaces = false

[tool.setuptools.package-data]
home_display = ["static/**/*"]
# Bundled so hands-free works on a clean machine: no Hermes install to read
# models out of, and no first-run download.
wakewords = ["*.onnx", "README.md"]
