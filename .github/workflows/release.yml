name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to package (for example, v0.3.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Build release packages
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd4d3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: home_display/web/package-lock.json

      - name: Build web display assets
        run: |
          npm ci --prefix home_display/web
          npm --prefix home_display/web run check
          npm --prefix home_display/web run build
          git diff --exit-code -- home_display/static

      - name: Install PortAudio runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes portaudio19-dev

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --wheel

      - name: Verify the wheel
        run: |
          python -m venv /tmp/hermes-release-smoke
          /tmp/hermes-release-smoke/bin/pip install dist/*.whl
          /tmp/hermes-release-smoke/bin/hermes-relay --help
          /tmp/hermes-release-smoke/bin/hermes-relay-home --help

      - name: Ensure the GitHub release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes

      - name: Upload packages to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" dist/*.whl dist/*.tar.gz --clobber

      # Configure a PyPI Trusted Publisher first, then set the repository
      # variable PYPI_PUBLISHING=enabled. Keeping this opt-in makes a tagged
      # GitHub release safe before the PyPI project exists.
      - name: Publish to PyPI
        if: vars.PYPI_PUBLISHING == 'enabled'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true

  update-homebrew:
    name: Update Homebrew formula
    if: vars.HOMEBREW_TAP_AUTOMATION == 'enabled'
    needs: package
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: achappell/homebrew-hermes-relay
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Render the pinned formula
        run: |
          VERSION="${RELEASE_TAG#v}"
          REVISION="$(git rev-list -n 1 "$RELEASE_TAG")"
          python scripts/generate_homebrew_formula.py \
            --version "$VERSION" \
            --revision "$REVISION" \
            --output tap/Formula/hermes-relay-tui.rb

      - name: Commit formula to tap
        working-directory: tap
        run: |
          VERSION="${RELEASE_TAG#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch Formula/hermes-streaming-tui.rb
          git add Formula/hermes-relay-tui.rb
          git diff --cached --quiet && exit 0
          git commit -m "chore: update hermes-relay-tui to ${VERSION}"
          git push origin HEAD:main
