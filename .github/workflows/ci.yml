name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: home_display/web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix home_display/web

      - name: Test and build web display
        run: |
          npm --prefix home_display/web test
          npm --prefix home_display/web run check
          npm --prefix home_display/web run build
          git diff --exit-code -- home_display/static

      - name: Install PortAudio headers
        run: |
          sudo apt-get update
          sudo apt-get install --yes portaudio19-dev

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Build distributions
        run: python -m build --sdist --wheel

      - name: Verify wheel installation
        run: |
          python -m pip install --no-deps dist/*.whl
          hermes-relay --help
          hermes-relay-home --help
