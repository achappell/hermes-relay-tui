; PlatformIO Project Configuration for Waveshare ESP32-S3-Touch-LCD-7B / 7A
;
; Build / Flash instructions:
;   pio run -e esp32-s3-touch-lcd-7b -t upload
;   pio device monitor

[platformio]
default_envs = esp32-s3-touch-lcd-7b
src_dir = main
boards_dir = boards

[env]
platform = espressif32 @ ~6.6.0
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct
upload_speed = 921600
board_build.partitions = partitions_16mb.csv

; Common build flags for ESP32-S3 N16R8 (16MB Flash, 8MB Octal PSRAM)
; Add a local build flag such as -D HERMES_DISPLAY_WS_URI=\"ws://display-host:8765/state\"
; to enable the appliance state subscription. The URI is intentionally not
; committed because the host and port belong to the installation.
build_flags = 
    -D BOARD_HAS_PSRAM
    -D LV_CONF_INCLUDE_SIMPLE
    -I main/include

; Target 1: Waveshare ESP32-S3-Touch-LCD-7B (1024x600 IPS RGB panel, GT911 touch)
[env:esp32-s3-touch-lcd-7b]
board = waveshare-esp32-s3-touch-lcd-7b
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.maximum_ram_size = 8388608
build_flags = 
    ${env.build_flags}
    -D WAVESHARE_TOUCH_LCD_7B
    -D LCD_WIDTH=1024
    -D LCD_HEIGHT=600

; Target 2: Waveshare ESP32-S3-Touch-LCD-7A (800x480 RGB panel variant)
[env:esp32-s3-touch-lcd-7a]
board = waveshare-esp32-s3-touch-lcd-7a
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.maximum_ram_size = 8388608
build_flags = 
    ${env.build_flags}
    -D WAVESHARE_TOUCH_LCD_7A
    -D LCD_WIDTH=800
    -D LCD_HEIGHT=480
