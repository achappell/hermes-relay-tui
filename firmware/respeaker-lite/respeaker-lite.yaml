# ESPHome build target for the Puck prototype hardware: Seeed reSpeaker
# Lite (XMOS XU316 DSP) + Seeed XIAO ESP32-S3 host MCU.
#
# Story 2 (SPEC.md / firmware/respeaker-lite) established WiFi, API, and
# board/platform sections only, proving the build target and hardware are
# real. Story 3 adds the I2S audio path and an on-device `micro_wake_word:`
# wake engine on top of that base. No identity/credential logic and no
# audio-streaming-to-host logic yet — those land in stories 4 and 5. The
# wake phrase here is the pretrained community model `hey_jarvis`, not
# "hey hermes" — see README.md's "Wake Phrase" section for why.
#
# Adapted from Seeed's own reSpeaker Lite ESPHome reference config
# (formatBCE/Respeaker-Lite-ESPHome-integration, credited from Seeed's wiki
# tutorial for this exact board: wiki.seeedstudio.com/respeaker_lite_ha/) —
# board/platform shape plus the I2S audio path and micro_wake_word block;
# the full reference's voice-assistant pipeline, timers, alarms, and LED
# animations are out of scope here and are not ported.
#
# Secrets: copy secrets.yaml.example to secrets.yaml next to this file and
# fill in installation-specific values. secrets.yaml is gitignored and must
# never be committed, matching the -D HERMES_DISPLAY_WS_URI pattern in
# firmware/esp32-s3-touch-lcd-7/platformio.ini of keeping installation
# values out of version control.

# Story 5: where the host bridge (puck_bridge/, a standalone process on the
# dev/household Mac) listens, and the hardcoded shared token this story
# stands in for Story 4's real per-device credential system. All three are
# installation-specific and gitignored via secrets.yaml, per this file's
# existing convention for WiFi/API/OTA values below.
substitutions:
  puck_bridge_host: !secret puck_bridge_host
  puck_bridge_port: !secret puck_bridge_port
  puck_device_token: !secret puck_device_token

esphome:
  name: respeaker-lite
  friendly_name: "Hermes Puck (reSpeaker Lite)"
  # TEMPORARY: raw PCM capture for a human to actually listen to (story 3
  # follow-up) -- see pcm_capture.h for why this design avoids the two
  # patterns that crash-looped the device in a prior session.
  includes:
    - pcm_capture.h
    # 1-p-1: identity gate -- consulted before capture, fed by upload status.
    - puck_identity.h
  # micro_wake_word does not start listening on its own -- MicroWakeWord::setup()
  # never calls start(), and its own data callback explicitly drops audio while
  # state_ == STOPPED. Without a voice_assistant: component (which normally
  # triggers this), it needs an explicit start action, or it sits permanently
  # stopped -- exactly matching every symptom seen debugging this story
  # (zero mic activity, zero detections, at any log verbosity).
  on_boot:
    - priority: -100  # run after all components finish setup(), not during boot
      then:
        - micro_wake_word.start
        # Only the first model in `models:` is enabled by default (see
        # __init__.py's "default_enabled = i == 0") -- hey_missy, listed
        # first below, gets this for free. Every model after it needs its
        # own explicit enable_model call or it's silently never invoked.
        - micro_wake_word.enable_model: hey_bestie
        - micro_wake_word.enable_model: hey_skippy
        - lambda: pcm_capture::setup();
        # Story 5: the VAD-gated, single-shot, wake-triggered capture
        # buffer, separate from the training-data capture buffer above.
        - lambda: pcm_capture::wake_capture::setup();
        # 1-p-1: establish identity BEFORE micro_wake_word can fire a
        # capture. Starts UNAUTHORIZED and only opens if a token is
        # actually configured -- a build shipped without one must refuse,
        # not capture.
        - lambda: puck_identity::setup("${puck_device_token}");
    - priority: -200  # after the capture buffer is allocated above
      then:
        - lambda: pcm_capture::start();
    # 1-p-2: bring the output path up last, so a failure here cannot
    # delay wake-word setup above. The delay lets the XU316 finish its own
    # init -- it is the bus master for both directions.
    - priority: -300
      then:
        - delay: 3s
        # The XMOS chip mutes its speaker output by default. Without this
        # the I2S writes all succeed and nothing is audible -- which looks
        # exactly like a broken output path.
        - lambda: id(respeaker).unmute_speaker();
        # 1-p-2 task 2's boot-time proof (streaming a static WAV over
        # HTTP from a dev machine) was REMOVED once verified: it pointed at
        # an ad-hoc server on a developer's laptop, so every later boot
        # would fail to fetch it and log an error for a test that had
        # already passed. The capability it proved is retained and
        # exercised by the media_player/audio_http stack below; the
        # evidence lives in the story and in PR #144.
esp32:
  board: seeed_xiao_esp32s3
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf
    version: recommended

# TEMPORARY, isolation step 1 of the safer PCM-capture redesign (story 3
# follow-up): enable PSRAM alone, with no capture/buffer logic yet, to
# test in isolation whether PSRAM enablement itself was the cause of the
# prior session's crash-loop (that attempt combined psram: + a resized
# fixed buffer in on_boot and crashed within ~1s -- ambiguous which of the
# two caused it). If this boots clean, PSRAM itself is not the trigger and
# a raw heap_caps_malloc-based capture buffer (no vector, no resize) is
# safe to add next.
psram:
  mode: octal

logger:
  level: DEBUG

# Enables OTA updates and Home Assistant API discovery/auth.
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# Training-data pipeline (story 3 follow-up): POSTs each rolling capture
# window to a local server on the dev Mac, replacing the far-too-slow
# serial/base64 dump path. See pcm_capture.h.
http_request:
  id: http_client
  timeout: 5s

# Volume/transport control that does not require Home Assistant. The API
# above only helps if something speaks it; this project's bridge does not,
# and there is no HA in this installation. A built-in web UI means volume
# is reachable from any browser on the LAN (http://respeaker-lite.local)
# -- the media_player renders with a volume slider and stop control.
#
# Added after the first real playback: there was no way to turn the thing
# down or shut it up without reflashing, which is not an acceptable
# property for a speaker in a house with sleeping children.
web_server:
  port: 80
  version: 3
  # `local: true` is the load-bearing line, not the version. By default
  # EVERY web_server version serves only a ~174-byte HTML shell that pulls
  # its JavaScript from https://oi.esphome.io (verified on-device: v3 and
  # v2 differ only in the CDN path). That would make the volume control
  # for this appliance depend on the house's internet connection and phone
  # out to esphome.io on every load -- both wrong for a device whose whole
  # premise is home-LAN-only operation (PRD NFR3). This embeds the assets
  # in flash instead: costs space, which this build has to spare, and
  # works when the internet does not.
  local: true

# Physical "make it stop" control. A web slider is fine for setting a
# level; it is useless when audio is blaring and you want it off NOW and
# your hands are not already on a browser. GPIO3 is the board's user
# button (pin config mirrors respeaker-lite-stock-test.yaml:390-397).
binary_sensor:
  - platform: gpio
    id: user_button
    name: "User button"
    pin:
      number: GPIO3
      inverted: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - media_player.stop: puck_media_player

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Fallback hotspot in case WiFi connection fails, so the device is still
  # reachable to fix configuration.
  ap:
    ssid: "Respeaker-Lite Fallback"
    password: !secret ap_fallback_password

# Mainline ESPHome's `i2s_audio`/`microphone` components require a literal
# 16kHz mic source and cannot resample; the XU316 only emits 48kHz/32-bit
# I2S. Both cited reference integrations (formatBCE's and Seeed's own,
# named above) solve this with a forked, patched `i2s_audio` component.
# Accepted as a trusted build dependency for this board — see the
# mid-implementation Decision in this story's spec file
# (_bmad-output/specs/spec-hermes-relay-tui/stories/3-implement-on-device-wake-word-detection.md).
#
# Vendored locally (components/i2s_audio/, a verbatim copy of
# formatBCE/esphome at the previously-pinned commit
# eedcdbee335dbe296d432b3e6421da0469907365) rather than pulled from git.
# Session 6 patched the 48kHz->16kHz decimation here with a proper
# anti-aliasing FIR filter, reasoning that the upstream fork's naive
# nearest-sample-drop decimation (confirmed via spectrogram to alias) was
# the cause of this story's wake-word non-detection problem. Session 17
# proved that reasoning backwards: building formatBCE's actual unmodified
# reference config side-by-side showed wake-word detection working
# cleanly with the stock, unfiltered decimation, and *not* working with
# this project's "improved" filter. Reverted back to the stock nearest-
# sample-drop (no filtering) -- see the decimation loop in
# components/i2s_audio/microphone/i2s_audio_microphone.cpp for the full
# explanation and story 3's session 17 notes for the investigation.
# Also vendors `micro_wake_word` locally (components/micro_wake_word/, a
# verbatim copy of this project's installed ESPHome 2026.8.2 package) to
# add a raw-probability diagnostic in streaming_model.cpp -- the stock
# component only ever logs a binary detected/not-detected outcome, which
# after three failed audio-pipeline fixes (gain, boxcar filter, proper FIR
# filter -- see story 3) never told us how close probability actually got
# to the cutoff. See streaming_model.cpp's perform_streaming_inference.
external_components:
  - source:
      type: local
      path: components
    components:
      - i2s_audio
      - micro_wake_word
      - respeaker_lite

# Required by respeaker_lite: below, to talk to the XMOS chip for the DFU
# firmware update. Pins/frequency match formatBCE's reference config.
i2c:
  - id: internal_i2c
    sda: GPIO5
    scl: GPIO6
    frequency: 400kHz

# Session 17 (story 3): flashes the reSpeaker Lite's onboard XMOS XU316
# DSP with the specific firmware version formatBCE's proven-working
# reference config depends on. This unit shipped with XMOS firmware
# 1.0.8; the reference (and Seeed's own official setup wiki,
# wiki.seeedstudio.com/respeaker_lite_ha/) specifies 1.1.0. Wired in
# permanently, not as a one-time manual step, so flashing this firmware
# onto any reSpeaker Lite unit -- not just the one already updated this
# session -- brings its XMOS firmware to the matching version
# automatically. Idempotent: the component checks the XMOS chip's current
# version against this one and only performs the DFU update if they
# differ, so this is a harmless no-op on a unit already at 1.1.0.
# firmware URL/version/md5 verbatim from formatBCE's reference, not
# invented. Vendored locally at components/respeaker_lite/ (pinned commit
# 3136cf7) with two environment-specific fixes documented in that
# component's own comments -- neither changes DFU/audio behavior.
respeaker_lite:
  id: respeaker
  reset_pin: GPIO2
  firmware:
    url: https://github.com/formatBCE/Respeaker-Lite-ESPHome-integration/raw/refs/heads/main/respeaker_lite_i2s_dfu_firmware_48k_v1.1.0.bin
    version: "1.1.0"
    md5: 9297155d1bf3eb21a9d4db52a89ea0c6

# I2S audio bus from the XU316 DSP into the XIAO ESP32-S3's host-side ADC
# input. Pin assignments sourced from Seeed's own wiki tutorial for this
# exact board (wiki.seeedstudio.com/respeaker_lite_ha/), also used by
# formatBCE/Respeaker-Lite-ESPHome-integration.
# 1-p-2 task 1: split into two buses so the board can both listen and
# speak. Input and output are separate `i2s_audio` entries that SHARE the
# same three clock pins -- the XU316 is the bus master for both directions,
# so lrclk/bclk/mclk are genuinely one set of wires driving two DMA
# channels. `allow_other_uses: true` on each pin is what lets two
# components legally claim them; without it ESPHome rejects the duplicate
# at validation. This is not a workaround -- it is the exact shape
# formatBCE's proven reference config for this board uses (see
# respeaker-lite-stock-test.yaml:1144-1166).
i2s_audio:
  - id: i2s_input
    i2s_lrclk_pin:
      number: GPIO7
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO8
      allow_other_uses: true
    i2s_mclk_pin:
      number: GPIO9
      allow_other_uses: true

  - id: i2s_output
    i2s_lrclk_pin:
      number: GPIO7
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO8
      allow_other_uses: true
    i2s_mclk_pin:
      number: GPIO9
      allow_other_uses: true

# The XU316's I2S output arrives as external-ADC, 48kHz, 32-bit, stereo
# audio (secondary/subordinate I2S mode — the XU316 is the bus master).
microphone:
  - platform: i2s_audio
    id: puck_mic
    i2s_audio_id: i2s_input
    i2s_din_pin: GPIO44
    adc_type: external
    pdm: false
    sample_rate: 48000
    bits_per_sample: 32bit
    i2s_mode: secondary
    channel: stereo
    # TEMPORARY diagnostic for the "zero audio pipeline activity" mystery --
    # logs raw amplitude every ~1s, independent of micro_wake_word, to prove
    # whether any signal reaches the ESP32 at all. Remove once resolved.
    #
    # Split per channel (ch0/ch1), not combined: micro_wake_word's
    # `channels: 1` selects channel index 1 only (matching this board's
    # documented ch1-fits-wake-word split -- see README), but the prior
    # combined diagnostic walked every 4-byte sample regardless of channel,
    # so a loud ch0 (ASR-optimized) signal could mask a silent/garbage ch1
    # and still show "peak amplitude" without proving the wake-word engine's
    # actual input channel ever received anything. This never got checked
    # before now -- see story 3's "one unexplained detail" note.
    on_data:
      - lambda: |-
          static uint32_t last_log_ms = 0;
          static int32_t running_max_ch0 = 0;
          static int32_t running_max_ch1 = 0;
          // Stereo, 32-bit: each frame is 8 bytes -- ch0 first 4 bytes, ch1 next 4.
          for (size_t i = 0; i + 7 < x.size(); i += 8) {
            int32_t sample0 = (int32_t)(x[i] | (x[i+1] << 8) | (x[i+2] << 16) | (x[i+3] << 24));
            int32_t sample1 = (int32_t)(x[i+4] | (x[i+5] << 8) | (x[i+6] << 16) | (x[i+7] << 24));
            int32_t abs0 = sample0 < 0 ? -sample0 : sample0;
            int32_t abs1 = sample1 < 0 ? -sample1 : sample1;
            if (abs0 > running_max_ch0) running_max_ch0 = abs0;
            if (abs1 > running_max_ch1) running_max_ch1 = abs1;
          }
          uint32_t now = millis();
          if (now - last_log_ms > 1000) {
            ESP_LOGI("mic_diag", "peak amplitude last ~1s -- ch0: %d, ch1: %d (bytes this callback: %d)",
                     (int) running_max_ch0, (int) running_max_ch1, (int) x.size());
            running_max_ch0 = 0;
            running_max_ch1 = 0;
            last_log_ms = now;
          }
      # Bounded memcpy into a buffer sized once at boot -- no allocation
      # or growth here. See pcm_capture.h.
      - lambda: pcm_capture::write(x.data(), x.size());
      # Story 5: same bounded-memcpy shape, into the separate VAD-gated
      # wake-capture buffer. A no-op whenever a wake capture isn't active.
      - lambda: pcm_capture::wake_capture::write(x.data(), x.size());
# 1-p-2 task 1: the board's onboard TLV320AIC3204 codec, reached over
# the same internal I2C bus the respeaker_lite component already uses to
# talk to the XMOS chip. The speaker below drives volume through this.
audio_dac:
  - platform: aic3204
    id: aic3204_dac
    i2c_id: internal_i2c

# 1-p-2 task 1: output path. Mirrors the mic's format exactly (48kHz,
# 32-bit, stereo, secondary mode) because both directions ride the same
# XU316-mastered clocks -- a mismatched output rate would fight the shared
# bclk/lrclk. Values match formatBCE's proven reference block for this
# board (respeaker-lite-stock-test.yaml:1179-1192).
#
# `timeout: never` keeps the I2S peripheral from tearing itself down
# between utterances; `buffer_duration: 100ms` is the DMA cushion that
# absorbs network jitter once P-2 task 2 streams real TTS through
# here. Story-5's chunked-upload path is deliberately untouched by all of
# this -- this is a second, independent direction on the bus.
speaker:
  - platform: i2s_audio
    id: puck_speaker
    i2s_audio_id: i2s_output
    i2s_dout_pin: GPIO43
    dac_type: external
    audio_dac: aic3204_dac
    sample_rate: 48000
    bits_per_sample: 32bit
    i2s_mode: secondary
    channel: stereo
    timeout: never
    buffer_duration: 100ms

  # 1-p-2 task 2: resampling stage in front of the hardware speaker.
  # Task 1 established the hard constraint this exists to satisfy -- the
  # XU316 masters the I2S clocks, so the speaker runs in secondary/slave
  # mode and CANNOT reconfigure the bus; a stream whose sample rate differs
  # from 48000 is rejected outright with "Incompatible stream settings"
  # (i2s_audio_speaker_standard.cpp:366). Hermes TTS will not necessarily
  # be 48kHz, so everything routes through here rather than at the metal.
  # Bit depth does not need to match -- only the sample rate is fixed in
  # slave mode -- so 16-bit in / 32-bit out is fine and is what formatBCE's
  # reference chain does (respeaker-lite-stock-test.yaml:1208-1217).
  - platform: resampler
    id: puck_resampler
    output_speaker: puck_speaker
    sample_rate: 48000
    bits_per_sample: 16

# 1-p-2 task 2: ESPHome's own HTTP streaming media source. This is the
# component that makes Puck-side playback viable at all -- it holds ONE
# persistent connection and reads it incrementally (esp_http_client_read),
# instead of pcm_capture.h's upload path which opens a fresh connection per
# 2KB chunk. Measured 2026-09-10, that upload path sustains 25.3 KB/s,
# while 16-bit TTS needs 32-48 KB/s: roughly half real-time, before
# counting its documented ESP_FAIL wedging and per-failure heap loss.
# Buffer is the latency/underrun tradeoff -- 100KB is ~1s of 48kHz 16-bit
# mono, enough to ride out household WiFi jitter without a long silence
# before Missy starts speaking.
media_source:
  - platform: audio_http
    id: puck_http_source
    buffer_size: 100000
  # 1-p-1 task 3: local sounds, embedded in flash. A refusal must NOT
  # depend on the network -- the whole point is to be audible when
  # something about the bridge relationship is wrong. Addressed as
  # `audio-file://<audio_file id>`.
  - platform: audio_file
    id: puck_local_source

# 1-p-1 task 3: the refusal sound. Descending pair (660Hz -> 440Hz), which
# reads as "no" almost universally and stays distinct from a future
# ASCENDING wake acknowledgement (1-p-2 task 7). 16kHz mono keeps it to
# ~11KB in flash; the resampler already in front of the speaker handles
# the rate difference.
audio_file:
  - id: refused_sound
    file: sounds/refused.wav

# 1-p-2 task 2: the player itself. Deliberately ONE pipeline -- a
# spoken reply is an announcement, and a second (media) pipeline would only
# add a mixer stage with nothing to mix. Sources feed in from the HTTP
# source above; decoded audio lands in the resampler, then the speaker.
media_player:
  - platform: speaker_source
    id: puck_media_player
    name: "Puck"
    # Volume lives here, NOT in a set_volume() lambda at boot. A hardcoded
    # speaker->set_volume() fights the media player's own volume state:
    # the player is the thing that persists, increments, and reports
    # volume, so anything setting the speaker directly is silently
    # overridden the first time the player touches it.
    #
    # 0.25 initial and a 0.8 ceiling are deliberate for a device that sits
    # in a room with people: first playback at 0.6 was, by direct report,
    # "quite loud", and an appliance that can be cranked to full by an
    # errant command is an appliance that can hurt. The ceiling is the
    # important half -- the initial value is merely polite.
    volume_initial: 0.25
    volume_max: 0.8
    volume_increment: 0.05
    announcement_pipeline:
      speaker: puck_resampler
      sources:
        - puck_http_source
        - puck_local_source
      format: WAV
      sample_rate: 48000
      num_channels: 1

# On-device wake-word detection. Wake phrase candidates are microwakeword.com-
# trained models (hey_missy/hey_bestie/hey_skippy below), A/B'd live against
# each other on real hardware -- see README.md for the "not hey hermes"
# history. The `stop` model is ESPHome's bundled internal model, kept
# internal (not exposed as a separately toggleable Home Assistant entity).
micro_wake_word:
  id: mww
  microphone:
    microphone: puck_mic
    channels: 1
    # gain_factor 4 (Seeed's tutorial value): tested and ruled out as the
    # cause of the non-detection problem below -- dropping this to 1
    # (no clipping, verified against raw mic_diag amplitudes) still
    # produced zero detections on live speech. See README's Known
    # Limitation and story 3's Implementation Notes for the full record.
    gain_factor: 4
  models:
    # Trained via microwakeword.com (see hey_missy.tflite/.json's own
    # README for provenance). Primary/default wake word -- listed first so
    # micro_wake_word's "default_enabled = i == 0" picks it up without an
    # explicit enable_model call.
    - model: wake_models/hey_missy.json
      id: hey_missy
    - model: wake_models/stop.json
      id: stop
      internal: true
    # Also trained via microwakeword.com, same A/B purpose as hey_missy
    # above -- comparing candidate wake phrases live, not primary.
    - model: wake_models/hey_bestie.json
      id: hey_bestie
    # Also trained via microwakeword.com, same A/B purpose as hey_missy
    # and hey_bestie above -- comparing candidate wake phrases live, not
    # primary.
    - model: wake_models/hey_skippy.json
      id: hey_skippy
  vad:
    model: wake_models/vad.json
    probability_cutoff: 0.05
  # Root cause of the "~1s VAD truncation" finding (2026-09-10 hardware
  # session): this option defaults to TRUE in micro_wake_word/__init__.py,
  # and this file never set it. With it true, the DETECTING_WAKE_WORD case
  # in micro_wake_word.cpp calls stop() in the *same* loop iteration that
  # fires on_wake_word_detected -- so the instant a wake capture starts,
  # the inference task tears down: process_probabilities_() stops updating
  # vad_state_, unload_models_() clears the VAD sliding window, and
  # microphone_source_->stop() drops the audio source feeding the capture.
  # Measured on hardware against the unfixed build: the wake trigger and
  # "Stopping wake word detection" land in the same millisecond, mic_diag
  # then goes silent for 1.7s -- exactly while the command is being spoken
  # -- until the 2s "mww stopped -- restarting" self-heal below re-arms
  # detection. Only then does VAD see real silence and close the window
  # 800ms later, at ~130KB. So the captured ~1s is post-restart audio, not
  # the question: every transcript came back empty because the payload was
  # silence (faster-whisper's own VAD filter stripped 1.020s of 1.020s).
  # The VAD was never deaf to sustained speech; it was not running.
  #
  # That self-heal has therefore been firing on every single wake, which is
  # what previously made this look like intermittent weak-signal instability.
  #
  # With this false: capture grew to 314160 bytes (2.45s) tracking actual
  # speech, whisper retained 1.49s of it, language confidence 0.57 -> 0.98.
  stop_after_detection: false
  # Story 5: turns a validated on-device wake into an actual outbound audio
  # payload for the first time. `wake_word` is the automation variable this
  # component's own trigger provides (see components/micro_wake_word/
  # __init__.py's `get_wake_word_detected_trigger()` build). Starting the
  # capture here, rather than immediately uploading, is what makes the
  # upload VAD-gated instead of firing on the wake phrase alone -- the
  # capture window still has to close (see the fast interval below) before
  # there is anything to upload.
  on_wake_word_detected:
    # 1-p-1: the gate lives inside wake_capture::start() -- deliberately,
    # so no caller can route around it -- and reports whether it refused.
    # A refusal must be AUDIBLE: an appliance that silently ignores a wake
    # is indistinguishable from a broken one, which is a worse outcome
    # than the refusal itself.
    - lambda: pcm_capture::wake_capture::start(wake_word);
    - if:
        condition:
          lambda: return pcm_capture::wake_capture::last_wake_refused;
        then:
          - media_player.play_media:
              id: puck_media_player
              media_url: "audio-file://refused_sound"
              announcement: true

# TEMPORARY diagnostic: mww's on_boot state-transition log (STOPPED ->
# STARTING -> DETECTING_WAKE_WORD) only fires once, right at boot, and is
# easy to miss if `esphome logs` attaches even a second late. This makes
# the same fact (is_running(), plus vad_state_ so we can see VAD react to
# speech even if wake-word inference itself never fires) pollable at any
# time without needing to catch a fresh boot. Remove once resolved.
interval:
  - interval: 2s
    then:
      - lambda: |-
          ESP_LOGI("mww_diag", "mww is_running: %s, vad_state: %s",
                   id(mww).is_running() ? "true" : "false",
                   id(mww).get_vad_state() ? "true" : "false");
          // Story 5, discovered live during this story's hardware smoke
          // test on a marginal-WiFi-signal device: mww can stop (API
          // disconnect churn, task starvation) with no crash marker and
          // nothing else re-arms it. A self-heal keeps the wake path
          // usable in that environment instead of requiring a manual
          // reboot every few minutes. This does not address the
          // underlying instability (still suspected weak-signal-driven,
          // unconfirmed) -- it only keeps wake detection available while
          // that's investigated separately.
          if (!id(mww).is_running()) {
            ESP_LOGW("mww_diag", "mww stopped -- restarting");
            id(mww).start();
          }
          // 1-p-1: identity state is otherwise only logged once at boot,
          // which is easy to miss -- the API log stream attaches seconds
          // after boot and the line has already scrolled past. Same reason
          // and same shape as the mww is_running poll above.
          ESP_LOGI("puck_identity", "state: %s (may_capture=%s)",
                   puck_identity::state_name(puck_identity::state),
                   puck_identity::may_capture() ? "true" : "false");
  # Story 5: disabled the story-3 serial-dump diagnostic wiring that used
  # to run here (pcm_capture::dump_over_serial(), still defined in
  # pcm_capture.h but no longer called). MAX_DUMPS=15 full ~256KB captures
  # base64-encoded over a 115200 baud serial link saturates the main loop
  # for several minutes on every boot -- starving WiFi/API and making mww
  # appear to stop (task starvation, not a crash). Discovered live during
  # this story's hardware smoke test: WiFi/API dropped and mww is_running
  # went false a couple minutes after every boot with no crash marker,
  # exactly matching this dump's duration. Story 3's own serial-dump
  # tooling (tools/collect_serial_dumps.py) is unaffected -- it drives this
  # same dump_over_serial() function directly when needed, not via this
  # always-on interval.
  # Story 5: ends the VAD-gated wake capture window on debounced silence.
  # 100ms keeps the end-of-utterance round-trip snappy without adding real
  # load -- this is a cheap boolean check, a no-op whenever no wake capture
  # is active (see pcm_capture::wake_capture::tick()).
  - interval: 100ms
    then:
      - lambda: |-
          pcm_capture::wake_capture::tick(id(mww).get_vad_state());
  # Story 5: the actual outbound upload, from a slow tick (never the
  # real-time audio path or the fast VAD-tick above) -- matches
  # `upload_and_restart`'s existing convention of only ever blocking on a
  # POST from a slow interval. A no-op until `tick()` above has closed a
  # capture window.
  - interval: 1s
    then:
      - lambda: |-
          pcm_capture::wake_capture::upload(id(http_client), "http://${puck_bridge_host}:${puck_bridge_port}/upload",
                                             "${puck_device_token}");
